# Supabase pauses free projects after 7 days with no database activity.
# This reads one row from the scoreboard every 3 days so it never goes idle.
# The key below is the public "anon" key, the same one already inside index.html.
name: Keep scoreboard awake

on:
  schedule:
    - cron: "17 14 */3 * *"   # every 3 days, mid-morning Eastern
  workflow_dispatch:           # adds a "Run workflow" button on the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one score
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1dm5yZ2JhdXR0bWtyaXJra25jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjI4ODQsImV4cCI6MjEwNjUzODg4NH0.4CmuBFESK9r3hxdZ3I7XKSmTWM8a_Uavo7QYoN6hV30" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1dm5yZ2JhdXR0bWtyaXJra25jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NjI4ODQsImV4cCI6MjEwNjUzODg4NH0.4CmuBFESK9r3hxdZ3I7XKSmTWM8a_Uavo7QYoN6hV30" \
            "https://cuvnrgbauttmkrirkknc.supabase.co/rest/v1/best?select=name&limit=1")
          echo "Supabase answered with HTTP $code"
          test "$code" = "200"
